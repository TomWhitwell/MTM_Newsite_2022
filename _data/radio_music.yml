  rights_heading: "Before using these recordings"
  rights_notes:
    - "Treat this content as if it were off-the-air radio. i.e If you sample a Michael Jackson song from the radio, it doesn't mean you have the rights to use that sample in your music"
    - "Some, not all, of this material is public domain or creative commons licensed. Where possible, I have tried to find material with CC-BY or more liberal licenses. Check the 'Source' links for details."
    - "Before publishing or selling anything created using this material, read about and understand Fair Use laws in your country"
    - "Some of this material is recorded off-air from internet radio stations in languages that I don’t speak - my apologies if any material is offensive or inappropriate. Some of the material in English also includes strong language and crazy or offensive ideas, and some of the audio may be sacred and should be treated carefully."
    - "Everything I know about these files is on this page. If you write to me to ask for more information, license details, contacts or anything else, I will not be able to answer."
