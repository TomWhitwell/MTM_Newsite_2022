- id: 61_ZX_Spectrum
  title: ZX
  draft: false
  release: 61 / 1.2.1
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: Speed
        description: Emulation speed, with a centre deadzone at exactly 100%.
        source: info.yaml
      x:
        label: Reverb
        description: Reverb wet/dry on Audio Out 1.
        source: info.yaml
      "y":
        label: Port 0x5F
        description: Readable by the running Z80 program at port 0x5F (IN 95) — a
          knob the Spectrum itself can see.
        source: info.yaml
    inputs:
      cv_1:
        label: |-
          Voice 1
          pitch
        description: Voice 1 pitch, 1V/oct (offset by Knob X).
        source: info.yaml
        type: cv
      cv_2:
        label: |-
          Voice 2
          pitch
        description: Voice 2 pitch, 1V/oct, when the switch is in the Middle position.
        source: info.yaml
        type: cv
      audio_l:
        label: |-
          Duty & drum
          pick
        description: Duty modulation; also latches the drum selection at each Pulse
          In 2 edge.
        source: info.yaml
        type: audio
      audio_r:
        label: Duty mod
        description: Duty / timbre modulation.
        source: info.yaml
        type: audio
      pulse_1:
        label: Note gate
        description: Note gate — held gates sustain the note.
        source: info.yaml
        type: pulse
      pulse_2:
        label: Drum Trig
        description: Drum trigger; the drum played is chosen by Audio In 1.
        source: info.yaml
        type: pulse
    outputs:
      pulse_out_1:
        label: 1-bit tone
        description: The bitbanged 1-bit tone, straight from the beeper engine.
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: 1-bit drum
        description: The 1-bit drum lane.
        source: info.yaml
        type: pulse
      cv_out_1:
        label: Tone density
        description: PCM-density monitor of the tone lane.
        source: info.yaml
        type: cv
      cv_out_2:
        label: Drum density
        description: PCM-density monitor of the drum lane.
        source: info.yaml
        type: cv
      audio_out_l:
        label: Tone audio
        description: Tone-density audio output.
        source: info.yaml
        type: audio
      audio_out_r:
        label: Drum audio
        description: Drum-density audio output.
        source: info.yaml
        type: audio
  switch_modes:
    up: 'Pause *: Pause the emulator — the position for uploading snapshots and editing
      the mapping from the Web UI. (* OneBit — duophonic voicing, interval on Knob
      Y.)'
    middle: 'Run *: Run the machine. (* OneBit — voice 2 follows CV In 2, with Knob
      Y as timbre.)'
    down: 'Keypress *: A mappable momentary keypress. HOLD at power-on to boot OneBit
      instead of the Spectrum. (* OneBit — cycles the drum kit. Positions marked *
      do something different in OneBit, the alternate boot mode.)'
  leds:
  - 'Default: Mode / status.'
  - 'Default: Engine / activity.'
  notes:
  - |-
    v1.2.1 — fixes the mapping read-back in the Web UI: longer SysEx replies from
    the card could arrive split across several WebMIDI events, and the UI dropped
    every fragment after the first, so reading the mapping back showed only a
    couple of inputs assigned and the rest blank.

    v1.2 — live AY mangling while .ay/.pt3 music plays: per-channel square duty
    (PWM the real chip can't do), envelope and noise period bend, and gate-mute,
    each with its own depth control. Also moves the Z80-readable input ports to a
    decode-safe set (0x23/0x27/0x2B/0x2F/0x33/0x63/0x67) that the ULA, Kempston
    and 128K paging latch can never claim. Snapshots and music decode in the
    browser and stream to the card, so any size fits with no large buffer on the
    RP2040. Hold the momentary switch DOWN at power-on to boot OneBit instead of
    the Spectrum.

    CREDITS — ComputerCard by Chris Johnson (Music Thing Modular). Z80 core:
    superzazu/z80 (Nicolas Allemand, MIT). Sinclair ROMs (c) Amstrad, used by
    permission. AY volume curve from measured real-chip data. OneBit's beeper engines
    are ports of real ZX-Spectrum routines (Joffa Smith, Shiru, Jason Brooke, Mark
    Alexander, utz, via Beepola / Chris Cowley). PT3 player: Pro Tracker 3 / Vortex
    Tracker. Built with Claude Code. See README.md for the full credits.
