- id: 36_GradualProcess
  title: GradualProcess
  draft: false
  release: 36 / 1.0.0
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: Tempo
        description: Always active in Play. Additive-process phrase after Glass's
          Music in Similar Motion — grows/shrinks one melodic unit at a time.
        source: info.yaml
      x:
        label: |-
          Clock Div (Z
          hold)
        description: Unassigned in Play. While Z is held — seven steps /8 /4 /2 x1
          x2 x4 x8.
        source: info.yaml
      "y":
        label: |-
          Add / Remove
          Unit
        description: 'Play — zone gesture: flick CW past ~2/3 and back to centre to
          add a unit; flick CCW past ~1/3 and back to remove one. While Z is held
          — Scale Select (six scales).'
        source: info.yaml
    inputs:
      pulse_1:
        label: Remove Unit
        description: Debounced trigger; removes the most recently added unit (minimum
          1 unit)
        source: info.yaml
        type: pulse
      pulse_2:
        label: Add Unit
        description: Debounced trigger; appends a freshly-generated unit
        source: info.yaml
        type: pulse
    outputs:
      cv_out_1:
        label: |-
          M-Voice
          Pitch
        description: v/oct melody pitch
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          T-Voice
          Pitch
        description: v/oct harmony pitch from the tonic triad per the current harmonisation
          type — never in unison with the melody
        source: info.yaml
        type: cv
      pulse_out_1:
        label: M-Voice Gate
        description: Sustained high for the note's full held duration, with a brief
          ~5ms low retrigger blip at the start of every new note
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: T-Voice Gate
        description: Identical timing to Pulse Out 1 — the two voices always attack
          and release together
        source: info.yaml
        type: pulse
  switch_modes:
    up: 'Play: Run the selected process'
    middle: 'Stop: Halt playback'
    down: 'Settings: Hold for settings — X = clock divide/multiply (/8…x8), Y = scale
      select (Major, Minor, Pentatonic Major/Minor, Blues, Chromatic). Main is process-specific
