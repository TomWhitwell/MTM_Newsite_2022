          and sets mixer lag in up mode
        source: info.yaml
      x:
        label: |-
          Loop Length
          Mixer Depth
        description: Sets channel 1 sequence length in middle mode and mixer depth
          1 in up mode
        source: info.yaml
      "y":
        label: |-
          Div / Mult
          Mixer Depth
        description: Sets channel 2 divide/multiply clock relationship in middle mode
          and mixer depth 2 in up mode
        source: info.yaml
    inputs:
      pulse_1:
        label: Ext Clock 1
        description: Replaces tap tempo and drives the main Turing clock
        source: info.yaml
