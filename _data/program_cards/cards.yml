- id: 95_offair2
  title: OffAir
  draft: false
  release: 95 / 1.0.1
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: Tuning
        description: Scans across the dial, summed with CV In 1
        source: info.yaml
      x:
        label: Brightness
        description: IF bandwidth — sets both the Station capture width and the audio
          brightness, from narrow and muffled counter-clockwise to wide and bright
          clockwise
        source: info.yaml
      "y":
        label: Noise Level
        description: Static floor, silent fully counter-clockwise. Swells and swishes
          on its own, heaviest on LW, and ducks away when you tune onto a Station
        source: info.yaml
    inputs:
      audio_l:
        label: Station 1 In
        description: Station 1 source in audio-input mode; replaced by a baked recording
          in baked-in audio mode
        source: info.yaml
        type: audio
      audio_r:
        label: Station 2 In
        description: Station 2 source in audio-input mode; becomes a keyed morse tone
          while the switch is held up
        source: info.yaml
        type: audio
      cv_1:
        label: Tuner
        description: Tuning offset added 1:1 to the Main knob, where ±5V covers roughly
          half the dial each way
        source: info.yaml
        type: cv
      cv_2:
        label: Noise
        description: Adds to the Knob Y noise level for voltage-controlled static
        source: info.yaml
        type: cv
      pulse_1:
        label: |-
          Shuffle
          Signals
        description: Rising edge re-randomises the Station and interference layout.
          In audio-input mode with the switch held up it becomes the morse key instead
        source: info.yaml
        type: pulse
      pulse_2:
        label: Insta-ference
        description: Rising edge fires a one-shot from the curated Insta-ference bank,
          restarting if retriggered
        source: info.yaml
        type: pulse
    outputs:
      audio_out_l:
        label: Out
        description: Full mix of tuned audio, whistles, static and Insta-ference
        source: info.yaml
        type: audio
      audio_out_r:
        label: Just Noise
        description: Noise and static only, for processing independently
        source: info.yaml
        type: audio
      cv_out_1:
        label: |-
          Signal
          Strength
        description: Envelope that rises as you tune onto a Station
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Station 1 CV
          Offset
        description: Station 1's offset from the Main knob — patch back into CV In
          1, through a slew or direct, to hunt or lock onto Station 1
        source: info.yaml
        type: cv
      pulse_out_1:
        label: |-
          Station 1
          Tuned Gate
        description: Gate high while tuned to Station 1
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: |-
          Station 2
          Tuned Gate
        description: Gate high while tuned to Station 2
        source: info.yaml
        type: pulse
  switch_modes:
    up: 'Dead Air / Morse: Held. In baked-in audio mode this mutes both Stations while
      the interference and their CV and gate outputs continue; in audio-input mode
      Station 2 becomes a 600Hz morse tone keyed by Pulse In 1'
    middle: 'Normal: Standard tuning behaviour'
    down: 'Baked-in Audio Boot: Held at power-on until all six LEDs flash, this replaces
      the live inputs with baked recordings for a self-contained radio'
  leds:
  - 'Default: Station 1 Signal Strength; Station 2 Signal Strength; SW Band; LW Band;
