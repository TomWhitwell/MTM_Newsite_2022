  panel:
    controls:
      main:
        label: |-
          Global Fill
          Macro
        description: Scales all lanes together using per-lane scale/offset from config
        source: info.yaml
      x:
        label: Patt Map X
        description: Horizontal position on the Grids pattern map
        source: info.yaml
      "y":
        label: Patt Map Y
        description: Vertical position on the Grids pattern map
        source: info.yaml
      z:
        label: Chaos
        description: Randomness amount fed into the pattern engine (active after long-press
          toggles alt layer on, with Z back in middle)
        source: info.yaml
    inputs:
      pulse_1:
        label: Ext Clock
        description: When patched, internal clock is bypassed and swing is ignored;
          follows external pulse edges
        source: info.yaml
      pulse_2:
        label: Patt Reset
        description: Rising edge resets pattern phase to the start of the bar
        source: info.yaml
      cv_1:
        label: Map Mod
        description: Adds to pattern map X, Y, or XY blend (per config). Held off
          after Z middle↔up flip until X or Y is moved past takeover deadband
        source: info.yaml
      cv_2:
        label: Fill Mod
        description: Global fill offset in Z middle; all three lane density offsets
          in Z up (after knob takeover)
        source: info.yaml
    outputs:
      pulse_out_1:
        label: Trig Lane 1
        description: Grids-style trigger output for drum/voice lane 1
        source: info.yaml
      pulse_out_2:
        label: Trig Lane 2
        description: Grids-style trigger output for drum/voice lane 2
        source: info.yaml
      cv_out_1:
        label: Trig Lane 3
        description: Digital pulse-style trigger for lane 3
        source: info.yaml
      cv_out_2:
        label: Aux Out
        description: Configurable accent, clock, or lane 3 mirror output
        source: info.yaml
  switch_modes:
    up: 'Per-Lane Density: Main / X / Y set density for lanes 1–3; pattern map is
      held from the last middle position'
    middle: 'Pattern Map: X / Y set pattern map position; Main is the global fill
      macro'
    down: 'Alt Layer Toggle: Hold down to toggle the alt layer (knob pickup/catch).
      While alt is active and Z is middle, Main / X / Y edit chaos, BPM, and swing'
