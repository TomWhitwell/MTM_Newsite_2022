        description: Step type for the step under the cursor - rest / normal / accent
          / slide
        source: info.yaml
      z:
        label: Reset Mode
        description: Held ≥1s, selects the behaviour applied by a Pulse In 2 reset
        source: info.yaml
    inputs:
      audio_l:
        label: |-
          Pitch Phase
          Offset
        description: Phase-shifts the pitch sequence
        source: info.yaml
        type: audio
      audio_r:
        label: |-
          Step-type
          Phase Offset
        description: Phase-shifts the step-type sequence
        source: info.yaml
        type: audio
      cv_1:
        label: Transpose
        description: Global transpose across the pattern
        source: info.yaml
        type: cv
      cv_2:
        label: |-
          Portamento
          Time
        description: Increase glide time
        source: info.yaml
        type: cv
      pulse_1:
        label: Ext Clock
        description: One step per rising edge, overrides the internal tempo. When
          connected, X selects Pulse Out 1 clock division from /1 (CCW) through /8
          (CW); the divided pulse fires on pattern steps 0, N, 2N, etc.
        source: info.yaml
        type: pulse
