        label: Wave CV
        description: Adds recipe-slot or wave modulation to the active synth voice.
        source: info.yaml
        type: cv
      pulse_1:
        label: Unused
        description: Unused in this no-Turing Gnarly branch.
        source: info.yaml
        type: pulse
      pulse_2:
        label: |-
          Envelope
          Trig
        description: Triggers selected envelopes; held gates sustain or loop supported
          envelopes and gate-off lets the envelope complete.
        source: info.yaml
        type: pulse
    outputs:
      audio_out_l:
        label: Oscillator 1
