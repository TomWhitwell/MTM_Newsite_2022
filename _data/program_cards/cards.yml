        source: info.yaml
      x:
        label: |-
          Sample Bank
          Select
        description: Selects active bank 0-5 (shown as a dimly lit LED); the bank
          is loaded on power-on and does not change the playing sample mid-session
        source: info.yaml
      "y":
        label: Delay Time
        description: Sets the Audio Out 2 echo time, sampled at each note-on — ~50
          ms slapback (fully CCW) to ~750 ms long echo (fully CW). Also sets the arpeggiator's
          internal step period when no external clock is present
        source: info.yaml
      z:
        label: |-
          MIDI Chan
          Select
        description: Hold Z down while powering on to enter configuration mode; Main
          knob selects the MIDI receive channel (LEDs 0-4 show it in binary, all off
          = omni). Release Z to save and exit
        source: info.yaml
    inputs:
      audio_l:
        label: |-
          Sample /
          Tuner In
        description: Recorded into the sample buffer while Z is held down. In tuner
          mode (Audio In 2 connected) this is instead monitored for pitch and passed
          through to Audio Out 1
        source: info.yaml
      audio_r:
        label: |-
          Tuner Mode
          Enable
        description: Insert any cable to activate the built-in tuner; normal sampler
          operation resumes when removed
        source: info.yaml
      pulse_2:
        label: |-
          Arpeggiator
          Clock (Gate
        description: Rising edge advances the arpeggiator step; takes priority over
          incoming MIDI clock and the internal Y-knob-synced timer
        source: info.yaml
    outputs:
      audio_out_l:
        label: Dry Mix
        description: Dry polyphonic sample mix (or Audio In 1 passthrough in tuner
          mode)
        source: info.yaml
      audio_out_r:
        label: Tape Echo
        description: Tape-style low-pass-filtered delay, wet only; time set by Y knob
          at each note-on
        source: info.yaml
      cv_out_1:
        label: |-
          Lowest Note
          CV
        description: 1V/oct pitch of the lowest currently held MIDI note, one octave
          down (or middle C reference in tuner mode)
        source: info.yaml
      pulse_out_1:
        label: |-
          Lowest Note
          Gate (Gate
        description: High while the tracked lowest-note voice is active
        source: info.yaml
      cv_out_2:
        label: |-
          Arpeggiator
          CV
        description: 1V/oct pitch of the current arpeggiator step; each step has a
          50% chance of an octave-down shift
        source: info.yaml
      pulse_out_2:
        label: |-
          Arpeggiator
          Gate (Gate
        description: "~50 ms gate pulse on each arpeggiator step"
        source: info.yaml
  switch_modes:
