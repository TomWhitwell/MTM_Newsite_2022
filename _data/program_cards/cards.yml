        source: info.yaml
      "y":
        label: Resonance
        description: Resonance emphasis for the core filter voice.
        source: info.yaml
      z:
        label: S&H Speed
        description: Live internal sample-and-hold clock speed while the momentary
          down gesture is held; uses soft pickup; minimum is slowest, maximum is fastest.
        source: info.yaml
    inputs:
      audio_l:
        label: Audio In
        description: Main mono audio input to the filter engine.
        source: info.yaml
        type: audio
      audio_r:
        label: Audio Mod In
        description: Secondary audio-rate control input used as extra parameter modulation.
        source: info.yaml
        type: audio
      cv_1:
        label: CV 1
        description: Consistent modulation for filter range and envelope sensitivity
          in all switch positions.
        source: info.yaml
        type: cv
      cv_2:
        label: CV 2
        description: Consistent modulation for depth; positive CV widens the envelope/S&H
          sweep, negative CV makes it shallower.
        source: info.yaml
        type: cv
      pulse_1:
        label: Clock
        description: External retrigger / clock input. Forces a new random step in
          sample-and-hold mode.
        source: info.yaml
        type: pulse
      pulse_2:
        label: S&H Gate
        description: Qualified gate input that forces the sample-and-hold gesture
          high while held after a real low-to-high gate.
        source: info.yaml
        type: pulse
    outputs:
      audio_out_l:
        label: |-
          LP Up / Ping
          Out
        description: Fully wet envelope-up low-pass output; transients open the filter
          upward. During S&H gesture this is the left side of the ping-pong S&H low-pass
          voice.
        source: info.yaml
        type: audio
      audio_out_r:
        label: |-
          LP Down /
          Pong Out
        description: Fully wet envelope-down low-pass output; transients close the
          filter from the stored range. During S&H gesture this is the right side
          of the ping-pong S&H low-pass voice.
        source: info.yaml
        type: audio
      cv_out_1:
        label: S&H CV
        description: Stepped sample-and-hold control voltage, always available as
          a utility output.
        source: info.yaml
        type: cv
      cv_out_2:
        label: Envelope CV
        description: Envelope follower control voltage, always available as a utility
          output.
        source: info.yaml
        type: cv
      pulse_out_1:
        label: Clock Mirror
        description: Mirrors Pulse In 1.
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: Sample Trig
        description: Divided sample trigger pulse fired once for every four newly
          sampled random steps.
        source: info.yaml
        type: pulse
