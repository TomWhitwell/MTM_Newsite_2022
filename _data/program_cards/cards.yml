          probability (Glitch) or drift probability (Stutter)
        source: info.yaml
      x:
        label: |-
          Degrade /
          Shuffle
        description: Glitch mode sets the degradation amount (decimation then bitcrush);
          Stutter mode sets the shuffle probability
        source: info.yaml
      "y":
        label: |-
          Degrade
          Probability
        description: Glitch mode sets the degradation probability; Stutter mode sets
          the repeat probability before a slice advances
        source: info.yaml
    inputs:
      audio_l:
        label: |-
          Main Audio
          In
        description: Source audio for buffering and processing
        source: info.yaml
        type: audio
      pulse_1:
        label: Clock In
        description: Rising edge defines beat length (max 2.33 seconds)
        source: info.yaml
        type: pulse
      pulse_2:
        label: Ext Gate
        description: Gate control for switch-middle trigger behaviour in both modes
        source: info.yaml
        type: pulse
      cv_1:
        label: Freeze CV
        description: Above approximately 0V stops recording and loops frozen buffer
          content
        source: info.yaml
        type: cv
      cv_2:
        label: Mod CV
        description: Bipolar modulation added to performance knobs — Glitch mode adds
          to X and Y, Stutter mode adds to X only
        source: info.yaml
        type: cv
    outputs:
      audio_out_l:
        label: |-
          Processed
          Out
        description: Glitched/stuttered output, or pass-through when the effect is
          inactive
        source: info.yaml
        type: audio
      audio_out_r:
        label: Dry Out
        description: Always a dry pass-through of Audio In 1
        source: info.yaml
        type: audio
      pulse_out_1:
        label: Slice Clock
        description: Pulse at each ratchet/slice boundary
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: Clock Mirror
        description: Direct mirror of Pulse In 1
        source: info.yaml
        type: pulse
      cv_out_1:
        label: |-
          Activity
          Gate
        description: High while glitch/shuffle is active, low during pass-through
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Descending
          Ramp
        description: Falls across each slice and resets at the slice boundary
        source: info.yaml
        type: cv
  switch_modes:
    up: 'Probabilistic: Effect triggers randomly against the probability threshold.
      Held at power-on (or left unheld) this also selects Glitch mode.'
    middle: 'External Gate: Effect triggers while Pulse In 2 is high. Held at power-on
