        label: CVOut1
        description: Held low in this no-Turing Gnarly branch.
        source: info.yaml
        type: cv
      cv_out_2:
        label: CVOut2
        description: Held low in this no-Turing Gnarly branch.
        source: info.yaml
        type: cv
      pulse_out_1:
        label: PulseOut1
        description: Held low in this no-Turing Gnarly branch.
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: PulseOut2
        description: Held low in this no-Turing Gnarly branch.
        source: info.yaml
        type: pulse
  switch_modes:
    up: 'Oscillator 2 Page: Edit oscillator 2. Main sets oscillator 2 interval or
      spread around unison, X sets oscillator 2 phase distortion, and Y selects oscillator
      2 recipe slot in the current bank.'
    middle: 'Oscillator 1 Page: Edit oscillator 1. Main sets shared pitch, X sets
      oscillator 1 phase distortion, and Y selects oscillator 1 recipe slot in the
      current bank.'
    down: 'Performance / Bank Page: Hold down to edit performance controls. Main selects
      recipe bank, X sets ring modulation, and Y sets noise or grit.'
