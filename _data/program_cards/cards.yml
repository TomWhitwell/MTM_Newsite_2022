- id: 94_Ouroboros
  title: Ouroboros
  draft: false
  release: 94 / 0.1
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: Feedback
        description: 0 to ~112% — unity around 3 o'clock, the last stretch runs away
          into tape saturation
        source: info.yaml
      x:
        label: Tape Length
        description: "~100ms to ~4s at centre speed, square law; lengthening splices
          in a copy of the loop so the bed keeps playing"
        source: info.yaml
      "y":
        label: Tape Speed
        description: Varispeed, +/-1 octave, centre = normal — Doppler-shifts everything
          already on the tape; slow tape is longer and darker
        source: info.yaml
      z:
        label: Mode
        description: Selects alternate control modes.
        source: info.yaml
    inputs:
      audio_l:
        label: Audio In
        description: Input to the record head
        source: info.yaml
      cv_1:
        label: |-
          Tape Speed
          CV
        description: Varispeed, 1V/oct, adds to Y (total range +/-2 octaves)
        source: info.yaml
      cv_2:
        label: Feedback CV
        description: Adds to the main knob
        source: info.yaml
      pulse_1:
        label: Freeze Gate
        description: High = freeze — the record head lifts and the loop just spins
        source: info.yaml
      pulse_2:
        label: Reverse Gate
        description: High = the tape runs backwards (playback only)
        source: info.yaml
    outputs:
      audio_out_l:
        label: Wet Out
        description: The playback head
        source: info.yaml
      audio_out_r:
        label: Dry Out
        description: Input thru — mix with the wet output yourself, or hard-pan
        source: info.yaml
      cv_out_1:
        label: Envelope Out
        description: Envelope follower of the wet output, 0..+6V
        source: info.yaml
      cv_out_2:
        label: |-
          Tape
          Position
        description: A 0..+6V ramp once per rotation — a loop-synced LFO
        source: info.yaml
      pulse_out_1:
        label: Splice Tick
        description: A 10ms pulse each time the splice passes the head — clock things
          to the tape rotation
        source: info.yaml
      pulse_out_2:
        label: Freeze State
        description: High while frozen
        source: info.yaml
  switch_modes:
    up: 'Freeze: The record head lifts; the loop spins forever and input is ignored'
    middle: 'Echo: Sound-on-sound with regeneration'
    down: 'Reverse: Momentary — the tape runs backwards while held, playback only'
  leds: []
  source:
  - releases/94_Ouroboros/info.yaml
  - releases/94_Ouroboros/README.md
