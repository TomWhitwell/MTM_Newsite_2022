        description: Centre is free run; clockwise locks a fixed 16/8/4/3/2 beat replay,
          counter-clockwise locks the same lengths with probabilistic per-step mutation
        source: info.yaml
      x:
        label: |-
          Melody
          Profile
        description: Selects one of five melodic transition profiles — Pentatonic
          Stability, Chromatic Tension, Jazz Tendencies, Glacial, Drone
        source: info.yaml
      "y":
        label: |-
          Percussion
          Profile
        description: Selects one of four percussion transition profiles — Steady,
          Syncopated, Jazz/Free, Sparse (voice B melodic profile in Dual Melody mode)
        source: info.yaml
      z:
        label: Scale Select
        description: Selects the quantisation scale index from 0 to 11 while the switch
          is held down; the new scale takes effect on the next clock pulse
        source: info.yaml
    inputs:
      pulse_1:
        label: Master Clock
        description: Rising edge advances both Markov chains; falls back to the CV
          In 2 internal clock after 3 seconds with no pulse
        source: info.yaml
        type: pulse
      cv_1:
        label: |-
          Post-Scale
          Transpose
        description: Bipolar ±12 semitone shift applied after scale quantisation;
          0V is no shift, and the input is frozen while the switch is held down
        source: info.yaml
        type: cv
      cv_2:
        label: |-
          Internal
          Tempo
        description: Sets internal tempo when Pulse In 1 is absent — 0V is 120 BPM,
          ranging roughly 20–220 BPM. In Dual Melody mode this becomes post-scale
          transpose for voice B
        source: info.yaml
        type: cv
    outputs:
      cv_out_1:
        label: |-
          Melody Pitch
          CV
        description: Quantised V/Oct pitch for the melody chain, hardware calibrated
        source: info.yaml
        type: cv
      pulse_out_1:
        label: |-
          Melody
          Change Gate
        description: 10ms gate fired only when the quantised melody pitch changes
          from the previous step
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: |-
          Percussion
          Trig
        description: Triggers for percussion hits, firing multiple times per clock
          for ratchets and flams. In Dual Melody mode this becomes the voice B gate
        source: info.yaml
        type: pulse
      cv_out_2:
        label: |-
          Percussion
          Accent CV
        description: Accent level across five steps — 0V for a rest up to +5V for
          a full accent. In Dual Melody mode this becomes voice B pitch CV
        source: info.yaml
        type: cv
      audio_out_l:
        label: |-
          Internal
          Synth Voice
        description: Square-wave oscillator pitched by the melody chain, shaped by
          a long decaying envelope and gated by percussion hits
        source: info.yaml
        type: audio
      audio_out_r:
        label: |-
          Internal
          Synth Voice
        description: Unused in primary mode; carries the independent voice B synth
          in Dual Melody mode
        source: info.yaml
        type: audio
  switch_modes:
    up: 'Transpose: Main knob sets melody base note from −12 to +12 semitones, applied
      before scale quantisation so it changes which scale degrees are played'
    middle: 'Loop & Lock: Main knob is symmetric around centre — centre is free running,
      clockwise locks a clean 16/8/4/3/2 beat replay of what just played, counter-clockwise
      locks the same replay with a 1-in-8 per-step chance of Markov mutation'
    down: 'Scale Select: Momentary. While held, the Main knob selects one of twelve
      quantisation scales and all six LEDs show the index in binary. Held at power-on
      instead selects Dual Melody mode'
  leds:
  - 'Default: Left Column Bit 0; Right Column Bit 0; Left Column Bit 1; Right Column
    Bit 1; Left Column Bit 2; Right Column Bit 2.'
  source:
