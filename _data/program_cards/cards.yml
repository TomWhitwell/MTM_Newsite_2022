      pulse_1:
        label: |-
          Ext Turing
          Clock
        description: External Turing clock in switch-up mode
        source: info.yaml
        type: pulse
      pulse_2:
        label: |-
          Envelope
          Trig
        description: Triggers selected envelope and oscillator sync in synth mode;
          held gates loop supported envelopes and gate-off lets them complete
        source: info.yaml
        type: pulse
    outputs:
      audio_out_l:
        label: |-
          Oscillator 1
          / Turing
        description: Oscillator 1 in synth mode; self-playing stepped oscillator 1
          in Turing mode
        source: info.yaml
        type: audio
      audio_out_r:
        label: |-
          Oscillator 2
          / Turing
        description: Oscillator 2 in synth mode; self-playing stepped oscillator 2
          in Turing mode
        source: info.yaml
        type: audio
      cv_out_1:
        label: |-
          Stepped
          Turing CV
        description: Scaled stepped Turing CV; continues updating in synth mode
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Smoothed
          Turing CV
        description: Smoothed Turing CV; continues updating in synth mode
        source: info.yaml
        type: cv
      pulse_out_1:
        label: |-
          Main Turing
          Pulse
        description: Main Turing pulse; continues updating in synth mode
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: |-
          Alternate
          Turing Pulse
        description: Alternate Turing bit pulse; continues updating in synth mode
        source: info.yaml
        type: pulse
  switch_modes:
    up: 'Turing machine mode: Z up: MAIN: Mutation; X: Sequence Length; Y: Clock Speed.'
    middle: 'Synthesiser mode: Z middle: MAIN: Pitch; X: Phase Distortion; Y: Waveform
      Morph.'
    down: 'Edit/save: Z down, hold: MAIN: Detune; X: Ring Modulation; Y: Noise/Grit.'
  leds:
  - 'Default: LED 1; LED 2; LED 3.'
  notes:
  - |-
    Core 1.4 is the standard firmware. Rad v9 is an alternate firmware image with independently editable Amp1/Amp2, PD1/PD2, and Pitch1/Pitch2 envelopes, separate oscillator waveform families, slot names, and saved sound-preset settings. Flash one firmware image at a time; both use the same hosted Envelope Lab and C1ZZL3 Import Lab.
    Both firmware variants provide a phase-distortion synth card with Turing machine mode, USB MIDI, browser editor tools, CZ Import Lab handoff, gate-held envelope looping, natural trigger completion, and audio smoothing for high-PD tones.
    Switch middle is PD synth mode (Main = pitch, X = phase distortion, Y = waveform morph). Pulse In 2 and MIDI note-on loop supported envelopes while held; gate/note-off lets the envelope complete naturally.
    Hold switch down from middle for performance edit (detune, ring modulation, noise/grit) and save.
    Switch up is Turing mode (Main = mutation, X = length, Y = clock speed).
    Turing CV and pulse outputs continue running in synth mode. Turing MIDI output is optional and defaults off.
    Factory envelope presets are never overwritten; custom envelopes use separate browser-stored slots.
    Envelope Lab edits and reads back envelopes and settings. C1ZZL3 Import Lab prepares translated Casio CZ drafts, including pitch envelopes, for review before sending them on to the card.


    Envelope Lab: Browser editor for amplitude, phase-distortion, and pitch envelopes, envelope readback, and performance settings.

    C1ZZL3 Import Lab: Hosted browser translator for Casio CZ `.syx` patches, with pitch-aware handoff into Envelope Lab for final editing and sending.

    MIDI CC1 controls phase distortion, CC20 detune, CC21 ring modulation, CC22 noise,
    CC23 waveform, and CC24 Turing CV octave range. Turing MIDI output defaults off.
