- id: 91_chorgan
  title: Chorgan
  draft: false
  release: 91 / 1.1.0
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: |-
          Timbre /
          Detune Zone
        description: Morphs all six voices through pulse, sine, saw, sine, pulse.
          Counter-clockwise of centre is clean with a 250ms envelope, clockwise is
          5 cents with a 100ms envelope
        source: info.yaml
      x:
        label: Root Pitch
        description: Sweeps the root from C3 to C6, summed with CV In 1
        source: info.yaml
      "y":
        label: Interval
        description: Semitone interval between the root and voice 2, from 0 for unison
          to 12 for an octave
        source: info.yaml
      z:
        label: Mode
        description: Selects alternate control modes.
        source: info.yaml
    inputs:
      cv_1:
        label: |-
          Root Pitch
          CV
        description: Root pitch at 1V/oct with 0V as C4, summed with Knob X and applied
          uniformly to all six voices
        source: info.yaml
        type: cv
      cv_2:
        label: |-
          Timbre
          Offset CV
        description: Bipolar offset to the Main knob timbre position; cannot push
          the timbre across a detune or slew zone boundary
        source: info.yaml
        type: cv
      audio_l:
        label: |-
          Slew Speed
          CV
        description: Portamento glide amount — 0V or unpatched is instant, +5V is
          roughly a one minute glide. In slew mode negative voltage shortens the zone
          rate
        source: info.yaml
        type: audio
      audio_r:
        label: |-
          Chord
          Inversion CV
        description: Bipolar octave inversions up to six steps each way, cycling the
          lowest voice up or the highest voice down. Affects the audio outputs only
        source: info.yaml
        type: audio
      pulse_1:
        label: |-
          Preset
          Advance
        description: Rising edge advances the chord extension preset, and does not
          break an active chord override
        source: info.yaml
        type: pulse
      pulse_2:
        label: |-
          Chord Recall
          Clock
        description: Rising edge recalls the next stored chord, wrapping at the end.
          Must be seen low once after boot before it responds
        source: info.yaml
        type: pulse
    outputs:
      audio_out_l:
        label: |-
          Six-Voice
          Mix
        description: The full six-voice chord mix
        source: info.yaml
        type: audio
      audio_out_r:
        label: |-
          Phase-Offset
          Mix
        description: The same six voices with per-voice phase offsets of 0 to 75 degrees
          for stereo width
        source: info.yaml
        type: audio
      pulse_out_1:
        label: |-
          Sub-Octave
          Square
        description: Clean square wave one octave below the root
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: |-
          Chord Event
          PWM
        description: PWM square at root pitch, resetting to 50 percent duty on each
          chord event then ramping to 20 percent at the zone rate
        source: info.yaml
        type: pulse
      cv_out_1:
        label: |-
          Voiced Pitch
          CV
        description: Root pitch plus the voiced interval at 1V/oct, clamped to ±5V
          and following the chord override
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Chord Event
          Ramp
        description: Unipolar downward ramp from +5V to 0V on each chord event, tracking
          the Pulse Out 2 timing exactly
        source: info.yaml
        type: cv
  switch_modes:
    up: 'Detune Zone B: Selects the higher pair of detune levels (or slew rates in
      slew mode) — 10 cents clockwise of centre, 15 cents counter-clockwise'
    middle: 'Detune Zone A: Selects the lower pair of detune levels (or slew rates
      in slew mode) — clean counter-clockwise of centre, 5 cents clockwise'
    down: 'Preset Cycle / Store: Hold one second to store the current chord to the
      next sequencer slot. Held at power-on this selects slew mode instead'
  leds:
  - 'Default: Interval Position / Slot Bit 0; Interval Position / Recall Bit 0; Interval
    Position / Slot Bit 1; Interval Position / Recall Bit 1; Interval Position / Slot
    Bit 2; Preset Brightness / Recall Bit 2.'
  notes:
  - |-
    Slew mode boots when the switch is held down at power-on until the LEDs flash — all on, then
    all off, around 200ms. Detune is disabled and chord changes glide instead, with per-voice
    portamento rates of instant, 200ms, 700ms or 3s set by the same four zones.

    The sequencer stores up to eight chords, each capturing pitch, interval and preset. Storing
    more than eight overwrites from the beginning. A recalled chord is released by moving Knob X
    or CV In 1 more than one semitone from where they sat at recall, or by moving Knob Y to a
    different step.
  source:
  - releases/91_chorgan/info.yaml
  - releases/91_chorgan/README.md
  slug: 91-chorgan
  url: "/workshopsystem/program-cards/91-chorgan/"
  tags:
  - synthesizer
  - chord
  - sequencer
  - polyphonic
  - portamento
  source_file: releases/91_chorgan/info.yaml
  source_url: https://github.com/TomWhitwell/Workshop_Computer/tree/main/releases/91_chorgan
  readme_url: https://github.com/TomWhitwell/Workshop_Computer/blob/main/releases/91_chorgan/README.md
  download_url: https://raw.githubusercontent.com/TomWhitwell/Workshop_Computer/main/releases/91_chorgan/chorgan.uf2
