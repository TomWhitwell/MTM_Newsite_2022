        label: Contour Gate
        description: Gates high on trace X's recorded shape
        source: info.yaml
      audio_out_l:
        label: "(unused)"
        description: Not used
        source: info.yaml
      audio_out_r:
        label: "(unused)"
        description: Not used
        source: info.yaml
  switch_modes:
    up: 'Live: Audition — X/Y play live to the CV outs, CV-in summed on top'
    middle: 'Play: Loop the recorded trace at Main-knob speed; X/Y knobs used to attenuate'
    down: 'Record: Hold to record a fresh trace; release to Middle to loop it'
  leds:
  - 'Live: two 3-LED level bars (brightness = |output| per X/Y).'
  - 'Record: buffer-fill gauge (LEDs fill 1->6 as recording approaches the ~75s cap).'
  - 'Play: a moving position dot — reverses and freezes with speed,'
