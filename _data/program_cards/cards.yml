      audio_out_r:
        label: Gate
        description: "~2ms trigger for normal/accent steps, held high on slide steps"
        source: info.yaml
        type: audio
      cv_out_1:
        label: Pitch
        description: Calibrated 1V/oct pitch output, quantised to semitones, with
          portamento on slide
        source: info.yaml
        type: cv
      cv_out_2:
        label: Accent CV
        description: "~5V on accented steps, 0V otherwise"
        source: info.yaml
        type: cv
      pulse_out_1:
        label: Clock
        description: Internal clock pulses, or a divided external clock when Pulse
          In 1 is connected. X selects /1 through /8; output pulses are phase-locked
          to pattern steps 0, N, 2N, etc., and Y sets the pulse width up to almost
          the full divided interval.
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: Accent Trig
        description: "~2ms trigger on accented steps. With Pulse In 1 connected, Y
          sets the gate width from the short trigger up to almost the external clock
          period."
        source: info.yaml
        type: pulse
