      cv_2:
        label: Fill Mod
        description: Global fill offset in Z middle; all three lane density offsets
          in Z up (after knob takeover)
        source: info.yaml
    outputs:
      pulse_out_1:
        label: Trig Lane 1
        description: Grids-style trigger output for drum/voice lane 1
        source: info.yaml
      pulse_out_2:
        label: Trig Lane 2
        description: Grids-style trigger output for drum/voice lane 2
        source: info.yaml
      cv_out_1:
        label: Trig Lane 3
        description: Digital pulse-style trigger for lane 3
        source: info.yaml
      cv_out_2:
        label: Aux Out
        description: Configurable accent, clock, or lane 3 mirror output
        source: info.yaml
  switch_modes:
    up: 'Z up: MAIN: Lane 1 Density; X: Lane 2 Density; Y: Lane 3 Density.'
    middle: 'Z middle: MAIN: Global Fill Macro; X: Pattern Map X; Y: Pattern Map Y.
      Z middle, alt: MAIN: Chaos; X: Internal BPM; Y: Swing.'
    down: 'Z down, momentary: MAIN: Tap Tempo. Z down, hold: MAIN: Alt Layer Toggle.'
