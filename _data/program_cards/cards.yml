- id: 74_Wild_Pebble
  title: Wild Pebble
  draft: false
  release: 74 / 1.0
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: |-
          Internal
          Tempo
        description: Internal clock speed with variable swing profile according to
          switch position when internally clocked
        source: info.yaml
      x:
        label: Density
        description: Trigger probability density control (modulated by CVIn1)
        source: info.yaml
      "y":
        label: Mutation
        description: Mutation intensity control (modulated by CVIn2)
        source: info.yaml
    inputs:
      pulse_1:
        label: Ext Clock
        description: External clock input; when active it overrides internal tempo
          clock
        source: info.yaml
        type: pulse
      pulse_2:
        label: Freeze Gate
        description: While held high, mutation updates are disabled and structure
          is preserved
        source: info.yaml
        type: pulse
      cv_1:
        label: Density Mod
        description: Modulates X density control
        source: info.yaml
        type: cv
      cv_2:
        label: Mutation Mod
        description: Modulates Y mutation control
        source: info.yaml
        type: cv
    outputs:
      pulse_out_1:
        label: |-
          Primary Trig
          Stream
        description: Main rhythm trigger stream used for melodic progression and kick
          events
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: |-
          Companion
          Trig Stream
        description: Derived companion trigger stream used for snare/percussion events
        source: info.yaml
        type: pulse
      cv_out_1:
        label: |-
          Quant Melody
          CV
        description: Quantized pitch CV from evolving scale-constrained sequence
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Energy /
          Tension CV
        description: Smoothed evolving modulation output from internal energy and
          tension state
        source: info.yaml
        type: cv
      audio_out_l:
        label: Kick Voice
        description: Internal kick/percussion synthesis output driven by primary trigger
          stream
        source: info.yaml
        type: audio
      audio_out_r:
        label: Snare Voice
        description: Internal snare/percussion synthesis output driven by companion
          trigger stream
        source: info.yaml
        type: audio
  switch_modes:
    up: 'Steady: Z up: Steady mode. Restrained mutation, tighter rhythms, and the
      calmest phrasing feel.'
    middle: 'Swaying: Z middle: Drift mode. Balanced mutation, moderate swing, and
      gradual harmonic movement.'
    down: 'Rocking: Z down: Surge mode. Strongest swing, wider melodic leaps, and
      the most animated behavior.'
  leds:
  - 'Default: Main Trigger; Density; Mutation; Energy; Clock Source; Tension.'
  notes:
  - |-
    Generative rhythm/melody organism with coupled trigger streams, quantized melody CV,
    internal kick/snare voices, evolving energy/tension modulation, and USB MIDI clock/note
    behavior. Main controls internal tempo when no external clock is present, X controls
    rhythmic density, and Y controls mutation amount. The switch selects Steady, Drift, or
    Surge behavior, moving from restrained patterns to more animated swing, mutation, and
    melodic activity. Pulse In 1 is external clock and Pulse In 2 freezes mutation while high.
  source:
  - releases/74_Wild_Pebble/info.yaml
  - releases/74_Wild_Pebble/README.md
