- id: 62_BioMimicry
  title: BioMimicry
  draft: false
  release: 62 / 1.2.0
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: Physics
        description: The fundamental law of the current ecosystem. Horses - gait and
          stride rate, sweeping walk, trot, canter and gallop with each gait in its
          own tempo band. Geese - contagion, from birds ignoring each other to one
          honk setting off the flock. Frogs - decoupling, from locked metronomic sync
          to total chaos. Rain - downpour, from silence to stuttering torrents. Meteors
          - debris density. Cicadas - coupling depth, from a steady drone to deep
          irregular surges.
        source: info.yaml
      x:
        label: Population
        description: How many agents are alive, 1 to 4. Horses always keep all four
          hooves - the knob adds whole animals to the herd. In the swarm modes each
          output channel carries three members, so a full population is twelve birds,
          frogs, meteors or insects.
        source: info.yaml
      "y":
        label: Chaos
        description: Per-mode randomness and spread - per-hoof timing jitter (Horses),
          spontaneous spark rate (Geese), natural-frequency spread (Frogs), leak rate
          (Rain), density wander (Meteors), rate spread across the field (Cicadas).
        source: info.yaml
    inputs:
      audio_l:
        label: Loudness
        description: An envelope follower on whatever you patch in, so the ecosystem
          hears the rest of your rack. A loud room agitates the geese into honking
          and shuts the cicadas up. Inactive when nothing is patched.
        source: info.yaml
        type: audio
      audio_r:
        label: Disturb
        description: Transient-sensitive rather than level-sensitive, because sudden
          movement is what alarms an animal rather than steady noise. A sharp attack
          counts as a Spook. Inactive when nothing is patched.
        source: info.yaml
        type: audio
      cv_1:
        label: Physics Mod
        description: Summed with Knob Main to modulate the current ecosystem's physics
          variable
        source: info.yaml
        type: cv
      cv_2:
        label: |-
          Population
          Mod
        description: Summed with Knob X to modulate how many agents are active
        source: info.yaml
        type: cv
      pulse_1:
        label: Spook
        description: Disrupts the environment. Horses - the herd startles into step.
          Geese - a guaranteed cascade. Frogs - a splash that scrambles every phase
          and destroys sync. Rain - a wind gust dumping energy into all the buckets.
          Meteors - a bolide spiking density to maximum. Cicadas - a footstep in the
          grass, silencing the field before it creeps back in.
        source: info.yaml
        type: pulse
      pulse_2:
        label: Clock
        description: An external tempo the ecosystem entrains to rather than obeys.
          Frogs treat it as a phantom oscillator and couple to its phase at whatever
          strength Knob Main sets, so the chorus dials from locked-to-clock to completely
          indifferent. Horses lock their stride, Geese lean honks toward the beat,
          Rain tops up the buckets, Meteors swell the debris field. Stops mattering
          about 3 seconds after the clock stops.
        source: info.yaml
        type: pulse
    outputs:
      audio_out_l:
        label: Audio L
        description: Agents rendered and placed in the stereo field by the mode's
          own logic - a stable image for Horses, fixed spots for the flock modes,
          a new position per hit for Rain and Meteors
        source: info.yaml
        type: audio
      audio_out_r:
        label: Audio R
        description: The right channel of the same stereo image
        source: info.yaml
        type: audio
      cv_out_1:
        label: |-
          Trig3 /
          State
        description: A trigger or a continuous control voltage depending on the switch
          position - see the switch sections
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Trig4 /
          State
        description: A trigger or a continuous control voltage depending on the switch
          position - see the switch sections
        source: info.yaml
        type: cv
      pulse_out_1:
        label: |-
          Trig1 / All
          Trigs
        description: Individual or summed agent triggers depending on the switch position
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: |-
          Trig2 /
          Accent
        description: Individual agent triggers or an accent gate depending on the
          switch position
        source: info.yaml
        type: pulse
  switch_modes:
    up: 'Discrete Routing: The four agents route individually - agents 1 and 2 to
      the pulse outs, agents 3 and 4 as calibrated 5V trigger blips on the CV outs,
      since they have no pulse out of their own'
    middle: 'Summed Routing: All active agents OR''d onto Pulse Out 1, an accent on
      Pulse Out 2 when two or more fire at once, and continuous CV on both CV outs
      - agent 1''s own state on CV 1, and the whole ecosystem''s on CV 2. Both are
      LEVELS in every mode, never ramps - CV 1 is that agent''s own activity (Horses
      footfalls, Frogs croaks, Rain bucket fill), CV 2 the whole ecosystem (Horses
      herd sync, Geese flock agitation, Frogs chorus coherence, Rain total water,
      Meteors debris density, Cicadas field loudness)'
    down: 'WebUI mode/Alt Boot: HOLD for WebUI mode. HOLD at power-on to boot TUNED
      mode instead of Rhythm - the LEDs announce which you got, Rhythm lighting the
      left column and Tuned the right. Tuned plays samples at their recorded pitch
      with no per-animal or per-hit detuning, so uploaded notes can be galloped or
      dripped, and both CV outs stay continuous. Switch Up gives agents 1 and 2 a
      trigger each with their own density on the CVs; Switch Middle gives all triggers
      on Pulse 1, Pulse 1 divided by four on Pulse 2, overall density on CV 1 and
      WHICH SAMPLE just fired on CV 2 as 1V/oct, one semitone per round-robin slot'
  leds:
  - 'Default: Ecosystem and Activity.'
  notes:
  - |-
    OUTPUTS BY SWITCH POSITION

    Switch Up (Discrete): Pulse Out 1 and 2 carry agents 1 and 2; CV Out 1 and 2
    fire agents 3 and 4 as calibrated 5V blips, because the Computer has only two
    pulse outs and every agent should get a physical trigger.

    Switch Middle (Summed): all agents OR'd onto Pulse Out 1, an accent on Pulse
    Out 2 when two or more agents hit at once, agent 1's continuous internal state
    on CV Out 1, and the whole-ecosystem state on CV Out 2.

    In TUNED boot the CV outs are always continuous - it never fires CV trigger
    blips. Switch Up gives agents 1 and 2 a pulse out each with their own smoothed
    densities on the CV outs. Switch Middle puts every trigger on Pulse Out 1,
    that divided by four on Pulse Out 2, overall density on CV Out 1, and on CV
    Out 2 a 1V/oct pitch saying WHICH round-robin slot just fired - one semitone
    per slot, stepped rather than slewed, so it drives an external oscillator as a
    melody with Pulse Out 1 as the gate.

    UNDER THE HOOD

    The physics engines run at a 1.5kHz control rate while voices, gates and CV
    run at the full 48kHz. Everything is integer fixed-point with no float in the
    hot path.

    SAMPLES

    Samples can be replaced over USB-MIDI from the web editor in Chrome or Edge:
    drag in WAVs, they are converted and loudness-matched in the browser and
    written to a reserved 1MB flash region. Uploads override the built-in
    recordings per slot, so one ecosystem can be replaced while the rest stay.

    The card is SILENT throughout: holding the switch stops the ecosystem and
    hands the card to USB, and it reboots back into playing when you are done.
    Writing flash halts execution and takes USB with it - the USB stack lives in
    flash - so a transfer is buffered in RAM and committed in one go. That caps a
    single upload at 160KB - about 3.4 seconds of audio - but uploads APPEND, so
    the full 1MB region is reachable in successive passes.

    LICENCE - CC-BY-4.0 covers the card's own source: use, fork or sell it, just
    credit Andy Jenkinson (uglifruit). Two things are not mine to relicense and
    keep their own terms - the sample library is from Pixabay under the Pixabay
    Content License, and ComputerCard.h is Chris Johnson's, MIT.

    CREDITS - ComputerCard by Chris Johnson (Music Thing Modular). The Kuramoto
    model of coupled oscillators (Yoshiki Kuramoto); leaky integrate-and-fire and
    inhomogeneous Poisson processes are standard point-process models. Built with
    Claude Code.
  source:
  - releases/62_BioMimicry/info.yaml
  - releases/62_BioMimicry/README.md
  slug: 62-biomimicry
  url: "/workshopsystem/program-cards/62-biomimicry/"
  tags:
  - generative
  - rhythm
  - stochastic
  - triggers
  - drums
  - swarm
  - organic
  - sample-player
  source_file: releases/62_BioMimicry/info.yaml
  source_url: https://github.com/TomWhitwell/Workshop_Computer/tree/main/releases/62_BioMimicry
  readme_url: https://github.com/TomWhitwell/Workshop_Computer/blob/main/releases/62_BioMimicry/README.md
  download_url: https://raw.githubusercontent.com/TomWhitwell/Workshop_Computer/main/releases/62_BioMimicry/UF2/biomimicry.uf2
  metadata:
    creator: Andy Jenkinson (uglifruit)
    language: C++ (ComputerCard)
    version: 1.2.0
    status: Released
    license: CC-BY-4.0
    created: '2026-08-05'
    updated: '2026-08-05'
    repository: https://github.com/uglifruit/WorkshopBio
    contact:
      social:
        github: https://github.com/uglifruit
    editor_url: https://tomwhitwell.github.io/Workshop_Computer/programs/62-biomimicry/web/index.html
    editor_note: Configure this card in your browser
- id: 63_Nibble
  title: NIBBLE
  draft: false
  release: 63 / 1.11.4
  summary: n/a
  description: n/a
  panel:
    controls:
      main:
        label: |-
          Envelopes /
          DJFilter
        description: MELODY - how long the note lasts, from a click to over five seconds,
          across both envelopes at once. PERCUSSION - a DJ filter, low-pass to the
          left, high-pass to the right, with a generous bypass at centre you can find
          by feel. Its movements are recorded into the loop.
        source: info.yaml
      x:
        label: |-
          Envelopes /
          Tempo
        description: MELODY - how the 'filter' and 'loudness' envelopes (Audio1 and
          Audio 2) respond to MainKnob. PERCUSSION - tempo, 40 to 240 BPM, ignored
          while an external clock is running on Pulse In 1. Changing it re-times the
          pattern rather than pitching it.
        source: info.yaml
      "y":
        label: Scale / Kit
        description: 'MELODY - one of twelve scales, ordered dark to bright from fully
          anticlockwise, shown on the LEDs as a bar while you turn it: Phrygian, Hirajoshi,
          Harmonic Minor, Natural Minor, Minor Pentatonic, m7 Arpeggio, Dorian, Major
          Pentatonic, Ionian (Major), Maj7 Arpeggio, Whole Tone, Chromatic. Because
          the ten combinations are ten DEGREES, the scale also sets the range - a
          four-note arpeggio spreads them over more than two octaves while Chromatic
          packs them into three quarters of one. PERCUSSION - the character of the
          whole kit at once, from lower and longer to higher and shorter, roughly
          half to double pitch and three decay steps either way. Applied when a voice
          is struck, so sweeping it never warps a sound that is already ringing -
          and its movements are RECORDED INTO THE LOOP alongside the filter, so a
          pattern can change its own kit character as it plays.'
        source: info.yaml
    inputs:
      cv_1:
        label: |-
          Four
          Voltages
        description: Patch one output of the Four Voltages module here. This is the
          keyboard. The card learns which voltage each button combination produces,
          so it works at any position of the Four Voltages knob - re-learn whenever
          you move it. If two combinations cannot be told apart the card says so during
          calibration rather than guessing.
        source: info.yaml
        type: cv
      cv_2:
        label: Transpose
        description: MELODY - 1V/oct transpose of the whole keyboard, up to two octaves,
          quantised to semitones so an imprecise voltage cannot leave everything slightly
          sharp. The root of the scale sits at 0V, so this transposes upward from
          there, and it is only active when something is actually patched. PERCUSSION
          - unused.
        source: info.yaml
        type: cv
      pulse_1:
        label: |-
          Retrigger /
          ClkIn
        description: MELODY - re-fires the current note without changing it, which
          is how you play repeated notes. PERCUSSION - an external clock at one pulse
          per beat. It OVERRIDES Knob X for as long as pulses keep arriving and hands
          the tempo back about three seconds after they stop, snapping to wherever
          the knob is then pointing. Locks anywhere from 30 to 240 BPM, and nudges
          into phase rather than snapping, so locking on never stutters the pattern.
        source: info.yaml
        type: pulse
      pulse_2:
        label: Unused
        description: Not used in this version.
        source: info.yaml
        type: pulse
    outputs:
      cv_out_1:
        label: Pitch / Bass
        description: 'MELODY - calibrated 1V/oct pitch, stepped, or glided when the
          switch is up. The root of the scale is 0V, so an oscillator at its own zero
          is already in tune. PERCUSSION - a four-note bassline played by the single
          buttons, which make no drum sound and so had a spare output: A is the root,
          B a tone below, C the fifth, D the octave. No combos and no scale - once
          a pattern is looping you can put a simple line under it with the same four
          buttons.'
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Harmony /
          BassGate
        description: MELODY - a second calibrated 1V/oct pitch, a third above the
          note you played and picked from the same scale, so it lands major or minor
          according to where in the scale you are. Patch it to a second oscillator
          with Pulse Out 1 as a shared gate and the ten buttons play two-part harmony.
          PERCUSSION - a 5V gate whenever a single (shift) button is pressed live,
          so the bassline on CV Out 1 can have its own envelope without opening on
          every drum hit. Live presses only - a recorded pattern contains no shift
          presses.
        source: info.yaml
        type: cv
      audio_out_l:
        label: |-
          Envelope1 /
          Drums
        description: 'MELODY - the FILTER envelope, roughly 24ms to 3.7 seconds, able
          to go a little snappier than the loudness envelope for plucks. Knob X decides
          whether it closes before the note fades or outlasts it. PERCUSSION - the
          mono drum bus, after the DJ filter. Audio Out 2 carries the SAME bus, not
          a stereo partner: patch either socket and you get the whole kit.'
        source: info.yaml
        type: audio
      audio_out_r:
        label: |-
          Envelope2 /
          Drums
        description: MELODY - the LOUDNESS envelope, roughly 44ms to 5.7 seconds across
          the macro knob. It is the one standing in for how long the note lasts, so
          it reaches genuine pad lengths. PERCUSSION - the same mono drum bus as Audio
          Out 1. They are deliberately identical and nothing splits them, so either
          socket gives you the whole kit rather than half of it.
        source: info.yaml
        type: audio
      pulse_out_1:
        label: Gate
        description: Fires on every note or drum hit, from the buttons, from a retrigger,
          or from the loop. In PERCUSSION it also gates the bassline the single buttons
          play.
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: Click
        description: PERCUSSION - a click track, one blip per crotchet, running whenever
          the loop is, so there is something to record along to. MELODY - unused.
        source: info.yaml
        type: pulse
  switch_modes:
    up: 'Glide / Record: MELODY - fast glide between notes instead of stepping; the
      harmony voice glides with it. PERCUSSION - record and overdub into the loop;
      the loop keeps running, and because it stores events rather than audio, overdubbing
      never degrades what is already there.'
    middle: 'Step / Play: MELODY - pitch steps straight to each new note. PERCUSSION
      - the loop plays, and you can play along without recording.'
    down: 'Calibrate: Calibration starts automatically at power-on, since the learned
      levels are never saved. HOLD for two seconds to start another at any time, or
      to abort one in progress - and in PERCUSSION this also ERASES the loop, which
      is the erase gesture. How it ends is on the LEDs: all six ramp up and fade means
      a clean calibration; the same fade with LEDs 4 and 5 flashing over it means
      two combinations are too close to separate, so nudge the Four Voltages knob
      and run it again; the two COLUMNS alternating fast for about a second and a
      half means it FAILED, which in practice means nothing is patched into CV In
      1 - the previous calibration is kept either way.'
  leds:
  - 'Default: Buttons A B / C D; Beat; Calibration / Record.'
  notes:
  - |-
    WHAT TO PATCH

    One output of the Four Voltages module into CV In 1. That is the whole
    required patch. Four Voltages has four outputs and they respond differently
    to the same buttons - if one gives you two combinations that collide during
    calibration, try another before changing anything else.

    CALIBRATION

    Calibration starts by itself about a second after power-up, since the
    levels are never saved and it is the first thing you would do anyway. Hold
    the momentary switch for two seconds to start another at any time, or to
    abort one in progress. Ten steps: the four single
    buttons, then the pairs as top row, bottom row, left column, right column,
    and the two diagonals - an order chosen so your hand alternates shape rather
    than re-forming similar grips. Hold each combination and TAP the switch to
    capture it.

    All six LEDs flash to confirm. The BUTTON leds 0-3 fluttering means the
    voltage was still moving - your hand, so hold steady and tap again. The
    MARKER leds 4 and 5 blinking means the capture was kept but that combination
    is too close to an earlier one to separate reliably; the calibration still
    completes, and you can move the Four Voltages knob and run it again. The two
    warnings use different lights deliberately.

    The collision warning is deliberately quiet - it fires only when two levels
    are within about 95mV, which is well below the point where the detector actually
    starts confusing them. A warning that appears on combinations you can play
    perfectly well just teaches you to ignore it.

    Calibration is NOT saved across power cycles, on purpose. The Four Voltages
    knob moves every voltage it produces, so a remembered calibration would be a
    wrong one - and a card that looks calibrated while playing the wrong notes is
    worse than one that admits it knows nothing.

    HOW IT LISTENS

    Ten combinations are learned: the four singles and the six pairs. Three- and
    four-button presses produce voltages that match nothing, and the card does
    nothing with them rather than snapping to the nearest note.

    Because Four Voltages does not return to a rest voltage, releasing a pair
    leaves the output sitting on one of that pair's own buttons. The card ignores
    that one level - and only that one, only until the voltage moves elsewhere.
    So A+B released to A is silent, but pressing B straight afterwards plays,
    and returning to A later plays too.

    NOTES, NOT VOLTAGES

    The combinations map to scale DEGREES rather than to pitches. The voltage
    only ever decides WHICH combination you pressed. That means moving the Four
    Voltages knob and re-learning gives you exactly the same notes back, which
    would not be true of a quantiser reading those voltages as pitches.

    THE DRUM KIT

    In PERCUSSION a SINGLE button makes no sound - it is a shift. Only pairs trigger,
    which is what lets you hold one button and tap the others to repeat a hit as
    fast as you like. Percussion is mostly repeated hits on the same drum, and a
    keyboard reading of the buttons cannot do that: to play a sound twice you
    must pass back through the held button, and if that were itself a sound then
    every repeat would be interrupted.

    Twelve voices, because hold-A-tap-B and hold-B-tap-A are different gestures
    even though they close the same switches:

      HOLD A   tap B cowbell    tap C metallic hi-hat  tap D open hi-hat
      HOLD B   tap A CRASH      tap C deep kick        tap D snappy snare
      HOLD C   tap A closed hat tap B snare            tap D kick
      HOLD D   tap A tom 1      tap B syn tom 2        tap C syn drum 3

    Hold C and a right hand has closed hat, snare and kick under three fingers.
    Hold D for the tom row. A and B carry the colour and the crash.

    Every voice is synthesised: a pitched body, a noise component, and an
    exponential decay on each. Kick 62Hz swept to 45Hz over 6ms; deep kick 50Hz;
    snare 190Hz; snappy snare 230Hz; closed hat 6kHz; hi-hats 7.6kHz; crash
    5.2kHz. The three cymbal voices are ring-modulated against a second
    oscillator at a non-integer ratio so they clang rather than hiss.

    The toms fall in pitch EXPONENTIALLY - 420Hz to 90Hz over about 50ms, fast
    then easing in - which is what makes a Simmons-style tom sound like one. A
    linear fall reaches the floor in a few milliseconds and spends the rest of
    the note at one pitch.

    Voices carry their own level, because peak amplitude stops being a proxy for
    loudness once decay times differ by two orders of magnitude: a 0.9-second
    crash at full scale delivers many times a kick's energy. The crash sits at
    20 percent, the kicks and snare at full.

    THE LOOPER

    Four bars, recording EVENTS rather than audio, so overdubbing never degrades
    what is already there and the tempo knob re-times a pattern instead of
    pitching it. An event stores WHICH SOUND - kick, snare, crash - not which
    buttons made it, because how a hit was played belongs to the performance.

    Hits quantise to 1/16 on playback; knob sweeps deliberately do not. Two
    knobs are automated - the Main DJ filter and the Y kit character - on
    separate lanes, so recording one never erases the other. Arming record never
    silences the loop and never writes a knob's resting position: automation is
    recorded only once the knob actually moves, and the physical knob reclaims
    control the moment you move it again.

    Sixteen voices can ring at once. When they are all busy the card steals the
    QUIETEST rather than the oldest, so a voice near the end of its decay goes
    before one that has just started. The old six-slot round robin was what made
    a loop appear to erase itself after a few overdub passes: a crash rings for
    nearly a second, and any six hits after it took its slot.

    LICENCE - CC-BY-4.0 covers this card's source: use, fork or sell it, just
    credit Andy Jenkinson (uglifruit). ComputerCard.h is Chris Johnson's and
    keeps its own MIT licence.

    CREDITS - ComputerCard by Chris Johnson (Music Thing Modular). Drum voices
    generalised from Wild Pebble (74); scale tables from Lockstep (89);
    degree-indexing from CA Sequencer (19); the Schmitt-band quantiser idiom
    from Goldfish (11); the state-variable filter's update ordering from bends
    (45). Built with Claude Code.
  source:
