      cv_1:
        label: CV In 1
        description: Divide/multiply modulation in middle mode; mix input 1 in up
          mode
        source: info.yaml
        type: cv
      cv_2:
        label: CV In 2
        description: Pitch offset in middle mode; mix input 2 in up mode
        source: info.yaml
        type: cv
      audio_l:
        label: |-
          Audio / CV
          In 1
        description: Mixer input 1 in up mode; direct audio pass-through source in
          middle mode
        source: info.yaml
        type: audio
      audio_r:
        label: |-
          Audio / CV
          In 2
        description: Mixer input 2 in up mode; direct audio pass-through source in
          middle mode
        source: info.yaml
        type: audio
    outputs:
      pulse_out_1:
        label: |-
          Matrix Gate
          1
        description: Channel 1 matrix gate / pulse output in both layers
        source: info.yaml
        type: pulse
      pulse_out_2:
        label: |-
          Matrix Gate
          2
        description: Channel 2 matrix gate / pulse output in both layers
        source: info.yaml
        type: pulse
      cv_out_1:
        label: |-
          Chan 1 Quant
          CV
        description: Quantized pitch CV in middle mode; crossfaded CV output 1 in
          up mode
        source: info.yaml
        type: cv
      cv_out_2:
        label: |-
          Chan 2 Quant
          CV
        description: Quantized pitch CV in middle mode; crossfaded CV output 2 in
          up mode
        source: info.yaml
        type: cv
      audio_out_l:
        label: |-
          Audio Out 1
          Pass-through
        description: Audio pass-through in middle mode; mixed audio output 1 in up
          mode
        source: info.yaml
        type: audio
      audio_out_r:
        label: |-
          Audio Out 2
          Pass-through
        description: Audio pass-through in middle mode; mixed audio output 2 in up
          mode
        source: info.yaml
        type: audio
  switch_modes:
    up: 'Mixer mode: Z up: MAIN: Mixer Lag; X: Mix Depth 1; Y: Mix Depth 2. Mixer
      mode active.'
    middle: 'Turing Mode: Z middle: MAIN: Randomness / Write; X: Loop Length; Y: Div
      / Mult. Turing mode active.'
    down: 'Tap tempo: Z down, momentary: MAIN: Tap Tempo.'
  leds:
  - 'Default: LED 1; LED 2.'
  notes:
  - |-
    Dual-layer Turing-style random sequencer with a switchable mixer layer and tap tempo or external clocking.
    The beta card builds on ideas and code from Tom Whitwell and Chris Johnson, with the Workshop Computer port adapting those concepts into a two-layer panel workflow.
    Pulse In 1 overrides tap tempo as the main clock; Pulse In 2 can clock channel 2 independently.
    CV In 1 controls divide/multiply on channel 2 in middle mode and mix input 1 in up mode. CV In 2 applies quantized pitch offset in middle mode and mix input 2 in up mode.
    Audio In 1 and Audio In 2 pass through in middle mode and become the mixer inputs in up mode.


    Web editor via MIDI SysEx: Browser editor reads and writes Turing and mixer settings over USB MIDI SysEx (Chrome recommended)
