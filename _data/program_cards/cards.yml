- id: 87_fr330hfr33
  title: Fr330hfr33
  draft: false
  release: 87 / 0.9.3
  summary: Hardware-tested acid bass synthesiser with selectable saw or square oscillator,
    switchable 18 or 24 dB diode-style filtering, accent and glide, distortion, USB
    MIDI device/host operation, and a persistent editable sequencer.
  description: Hardware-tested acid bass synthesiser with selectable saw or square
    oscillator, switchable 18 or 24 dB diode-style filtering, accent and glide, distortion,
    USB MIDI device/host operation, and a persistent editable sequencer.
  panel:
    controls:
      main:
        label: Cutoff
        description: 'Sets the diode-style ladder filter resting cutoff with a curved
          response: counter-clockwise is dark, the middle is broad and musical, and
          clockwise is bright.'
        source: curated
      x:
        label: Resonance
        description: 'Uses a curved response: the lower range adds body, the upper
          range becomes nasal and acid-like, and the final part of travel reaches
          firm self-oscillation. Broad diode-pair saturation keeps the oscillation
          round, while X adds only a small amount of extra filter-envelope sweep.'
        source: curated
      "y":
        label: |-
          Decay /
          Glide
        description: Couples envelope decay and pitch glide. Counter-clockwise gives
          short notes with nearly immediate pitch changes; selected slides are already
          obvious around noon, while clockwise gives longer notes, a longer downward
          filter sweep, and exaggerated slides.
        source: curated
      z:
        label: |-
          CV /
          Sequence /
        description: Up selects external CV/gate or USB MIDI control, middle selects
          the random sequencer, and holding down simulates pulling the batteries.
        source: curated
    inputs:
      cv_1:
        label: Pitch CV
        description: 1V/oct pitch input in switch-up CV/gate mode.
        source: info.yaml
      pulse_1:
        label: Gate In
        description: External gate input in switch-up CV/gate mode.
        source: info.yaml
      pulse_2:
        label: |-
          Clock /
          Slide
        description: External sequencer clock in switch-middle mode. In switch-up
          CV/MIDI mode, holding this input high manually enables glide for pitch changes.
        source: info.yaml
    outputs:
      audio_out_l:
        label: |-
          Filtered
          Voice
        description: Enveloped post-filter acid bass voice.
        source: info.yaml
      audio_out_r:
        label: Raw Osc
        description: Phase-aligned raw selected oscillator for blending with the filtered
          voice.
        source: info.yaml
      cv_out_1:
        label: Pitch Out
        description: Calibrated 1V/oct output following the currently played pitch.
        source: info.yaml
      pulse_out_1:
        label: Gate Out
        description: Gate output following external, MIDI, or sequencer notes.
        source: info.yaml
  switch_modes:
    up: External CV/gate or USB MIDI mode. CV In 1 controls pitch, Pulse In 1 controls
      gate, and holding Pulse In 2 high enables manual glide; overlapping MIDI notes
      glide automatically without retriggering the envelope.
    middle: History-aware generative sequencer that avoids recent repeats, favors
      nearby scale motion, and occasionally makes wider or octave jumps. Pulse In
      2 supplies an exact external clock; otherwise the configured internal tempo
      or optional MIDI clock can use adjustable swing.
    down: Momentary battery pull. The gate falls, the current VCA level is held briefly,
      then pitch, filter, resonance, and both audio outputs collapse with the virtual
      supply.
  leds:
  - LEDs 1, 3, and 5 indicate switch-up CV/MIDI mode, switch-middle sequencer mode,
    and switch-down battery-pull mode respectively.
  - LED 2 follows the current gate, with a dim idle level.
  - LED 4 indicates accented notes.
  - In sequencer mode LED 3 pulses one to four times to identify the active pattern
    slot.
  - LED 6 displays note brightness, or stays fully lit in 18 dB three-pole mode.
  source:
  - releases/87_fr330hfr33/info.yaml
  - releases/87_fr330hfr33/README.md
