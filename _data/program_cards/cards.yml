      audio_out_r:
        label: |-
          Rain Audio
          (right)
        description: Backyard rain audio (right). Use either for mono audio.
        source: info.yaml
      cv_out_1:
        label: RI CV
        description: Current intensity value as CV, about -6v to +6v
        source: info.yaml
