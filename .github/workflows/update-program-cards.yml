name: Update program card data

on:
  workflow_dispatch:
    inputs:
      workshop_ref:
        description: "Workshop_Computer ref to import, defaults to _data/program_cards/import.yml"
        required: false
        type: string
  repository_dispatch:
    types:
      - workshop-computer-program-cards
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-program-cards
  cancel-in-progress: false

jobs:
  update-program-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Music Thing site
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Read program card import source
        env:
          WORKFLOW_REF: ${{ inputs.workshop_ref }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
        run: |
          ruby <<'RUBY' >> "$GITHUB_ENV"
          require "yaml"

          config = YAML.safe_load(File.read("_data/program_cards/import.yml"), aliases: true) || {}
          source = config.fetch("workshop_computer", {})
          repo = ENV.fetch("WORKSHOP_COMPUTER_REPO", "").strip
          repo = source.fetch("repo", "TomWhitwell/Workshop_Computer") if repo.empty?

          ref = ENV.fetch("WORKFLOW_REF", "").strip
          ref = ENV.fetch("DISPATCH_REF", "").strip if ref.empty?
          ref = ENV.fetch("WORKSHOP_COMPUTER_REF", "").strip if ref.empty?
          ref = source.fetch("ref", "main") if ref.empty?

          puts "WORKSHOP_COMPUTER_REPO=#{repo}"
          puts "WORKSHOP_COMPUTER_REF=#{ref}"
          RUBY
          echo "Importing ${WORKSHOP_COMPUTER_REPO}@${WORKSHOP_COMPUTER_REF}"

      - name: Check out Workshop Computer card data
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WORKSHOP_COMPUTER_REPO }}
          ref: ${{ env.WORKSHOP_COMPUTER_REF }}
          path: _workshop_computer
          fetch-depth: 0

      - name: Import program card YAML
        run: ruby scripts/import_program_cards.rb --source _workshop_computer

      - name: Show generated changes
        run: git status --short _data/program_cards _program_cards scripts/import_program_cards.rb

      - name: Build site
        run: bundle exec jekyll build

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: program-cards/update-from-workshop-computer
          delete-branch: true
          title: Update program card data from Workshop_Computer
          commit-message: Update program card data from Workshop_Computer
          add-paths: |
            _data/program_cards/cards.yml
            _data/program_cards/tags.yml
            _program_cards/*.md
          body: |
            Automated refresh of `_data/program_cards/cards.yml` and generated card wrappers from `Workshop_Computer/releases/*/info.yaml`.

            The source repo/ref is controlled by `_data/program_cards/import.yml`.
